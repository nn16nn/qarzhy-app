name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android қаңқасын жасау (бір рет)
        if: hashFiles('android/app/build.gradle.kts', 'android/app/build.gradle') == ''
        run: |
          flutter create . --org io.github.nn16nn --project-name qarzhy --platforms android
          rm -rf test
          git config user.name "qarzhy-ci"
          git config user.email "ci@users.noreply.github.com"
          git add android .metadata
          git commit -m "CI: android қаңқасы" || true
          git push || true

      - name: Кілт
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore
            echo "Кілт табылды — release қолтаңбасы" | tee -a build.log
            printf 'storeFile=upload.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > android/key.properties
          else
            echo "ЕСКЕРТУ: KEYSTORE_PASSWORD немесе KEY_ALIAS жоқ — debug қолтаңбасы" | tee -a build.log
          fi

      - name: Жинау
        run: |
          set -o pipefail
          flutter --version | tee -a build.log
          flutter pub get 2>&1 | tee -a build.log
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build.log || true
          flutter build apk --release 2>&1 | tee -a build.log
          flutter build appbundle --release 2>&1 | tee -a build.log
          echo "== SIGNER ==" | tee -a build.log
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab 2>&1 | grep -E "SHA256|Owner" | tee -a build.log

      - name: Журналды сақтау (ci-log тармағы)
        if: always()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/build.log 2>/dev/null || echo "no log" > /tmp/log/build.log
          echo "${{ job.status }} ${{ github.sha }}" > /tmp/log/status.txt
          cd /tmp/log && git init -q && git checkout -q -b ci-log
          git config user.name "qarzhy-ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "log ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qarzhy-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
