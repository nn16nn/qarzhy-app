name: qarzhy
description: Qarzhy — жеке қаржы есебі
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ">=2.0.10 <4.0.0"
  path_provider: ">=2.1.0 <3.0.0"
  file_picker: ">=13.0.0 <14.0.0"
  in_app_purchase: ">=3.2.0 <4.0.0"
  in_app_purchase_android: ">=0.3.0 <1.0.0"
  url_launcher: ">=6.2.0 <7.0.0"

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/banks/
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-400.ttf
          weight: 400
        - asset: assets/fonts/Onest-500.ttf
          weight: 500
        - asset: assets/fonts/Onest-600.ttf
          weight: 600
        - asset: assets/fonts/Onest-700.ttf
          weight: 700
    - family: Serif
      fonts:
        - asset: assets/fonts/Cormorant-700.ttf
          weight: 700
