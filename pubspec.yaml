name: qarzhy
description: Qarzhy — жеке қаржы есебі
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-400.ttf
          weight: 400
        - asset: assets/fonts/Onest-500.ttf
          weight: 500
        - asset: assets/fonts/Onest-600.ttf
          weight: 600
        - asset: assets/fonts/Onest-700.ttf
          weight: 700
    - family: Serif
      fonts:
        - asset: assets/fonts/Cormorant-700.ttf
          weight: 700
